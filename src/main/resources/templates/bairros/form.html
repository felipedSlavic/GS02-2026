<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bairro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🌧️ Cidade em Dia de Chuva</a>
        <div>
            <a class="btn btn-sm btn-light" th:href="@{/bairros}">Bairros</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/trechos}">Trechos</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/leituras}">Leituras</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 560px">
    <!-- id nulo = inclusão; id preenchido = alteração -->
    <h1 class="h3 mb-3" th:text="${bairro.id() == null} ? 'Novo bairro' : 'Editar bairro'">Bairro</h1>

    <!-- Erro vindo do service (catch do controller) -->
    <div class="alert alert-danger" th:if="${erro != null}" th:text="${erro}"></div>

    <!-- th:object liga o form ao "bairro" do Model; *{campo} é cada campo dele -->
    <form class="card card-body shadow-sm" th:action="@{/bairros/salvar}" th:object="${bairro}" method="post">

        <input type="hidden" id="id" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" for="nome">Nome</label>
            <input type="text" id="nome" class="form-control" th:field="*{nome}" maxlength="80"
                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="zona">Zona</label>
            <select id="zona" class="form-select" th:field="*{zona}"
                    th:classappend="${#fields.hasErrors('zona')} ? 'is-invalid'">
                <option value="">Selecione...</option>
                <option th:each="z : ${zonas}" th:value="${z}" th:text="${z}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('zona')}" th:errors="*{zona}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="populacao">População</label>
            <input type="number" id="populacao" class="form-control" th:field="*{populacao}" min="0"
                   th:classappend="${#fields.hasErrors('populacao')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('populacao')}" th:errors="*{populacao}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a class="btn btn-outline-secondary" th:href="@{/bairros}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
