<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bairros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🌧️ Cidade em Dia de Chuva</a>
        <div>
            <a class="btn btn-sm btn-light" th:href="@{/bairros}">Bairros</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/trechos}">Trechos</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/leituras}">Leituras</a>
        </div>
    </div>
</nav>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Bairros</h1>
        <a class="btn btn-success" th:href="@{/bairros/novo}">+ Novo bairro</a>
    </div>

    <!-- Mensagem de erro (ex.: R2) vinda do controller -->
    <div class="alert alert-danger" th:if="${erro != null}" th:text="${erro}"></div>

    <div class="alert alert-secondary" th:if="${#lists.isEmpty(bairros)}">Nenhum bairro cadastrado.</div>

    <table class="table table-striped table-hover bg-white shadow-sm" th:unless="${#lists.isEmpty(bairros)}">
        <thead class="table-primary">
        <tr>
            <th>Nome</th>
            <th>Zona</th>
            <th>População</th>
            <th class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody>
        <!-- BairroDTO é record: os campos são lidos como b.nome(), b.zona()... -->
        <tr th:each="b : ${bairros}">
            <td th:text="${b.nome()}"></td>
            <td th:text="${b.zona()}"></td>
            <td th:text="${b.populacao()}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/bairros/{id}/editar(id=${b.id()})}">Editar</a>

                <!-- Excluir é um form POST, nunca um link GET -->
                <form class="d-inline" method="post"
                      th:action="@{/bairros/{id}/excluir(id=${b.id()})}"
                      onsubmit="return confirm('Excluir este bairro?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                </form>

                <a class="btn btn-sm btn-outline-dark" th:href="@{/bairros/{id}/painel(id=${b.id()})}">Painel</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
