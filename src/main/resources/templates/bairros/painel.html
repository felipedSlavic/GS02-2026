<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel do bairro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🌧️ Cidade em Dia de Chuva</a>
        <div>
            <a class="btn btn-sm btn-light" th:href="@{/bairros}">Bairros</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/trechos}">Trechos</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/leituras}">Leituras</a>
        </div>
    </div>
</nav>

<main class="container">
    <h1 class="h3" th:text="|Painel — ${bairro.nome()}|">Painel</h1>
    <p class="text-muted" th:text="|Zona ${bairro.zona()} · População ${bairro.populacao()}|"></p>

    <!-- Contagens: vêm prontas do PainelService -->
    <div class="row g-3 mb-4">
        <div class="col-4">
            <div class="card text-bg-success text-center"><div class="card-body">
                <div class="small">NORMAL</div>
                <div class="fs-2 fw-bold" th:text="${qtdNormal}">0</div>
            </div></div>
        </div>
        <div class="col-4">
            <div class="card text-bg-warning text-center"><div class="card-body">
                <div class="small">ATENCAO</div>
                <div class="fs-2 fw-bold" th:text="${qtdAtencao}">0</div>
            </div></div>
        </div>
        <div class="col-4">
            <div class="card text-bg-danger text-center"><div class="card-body">
                <div class="small">ALERTA</div>
                <div class="fs-2 fw-bold" th:text="${qtdAlerta}">0</div>
            </div></div>
        </div>
    </div>

    <div class="alert alert-secondary" th:if="${#lists.isEmpty(itens)}">Este bairro ainda não tem trechos.</div>

    <table class="table table-hover bg-white shadow-sm" th:unless="${#lists.isEmpty(itens)}">
        <thead class="table-primary">
        <tr>
            <th>Logradouro</th>
            <th>Calçada</th>
            <th>Altitude (m)</th>
            <th>Última lâmina (cm)</th>
            <th>Último status</th>
        </tr>
        </thead>
        <tbody>
        <!-- PainelItemDTO é record: item.logradouro(), item.ultimoStatus()... -->
        <tr th:each="item : ${itens}">
            <td th:text="${item.logradouro()}"></td>
            <td th:text="${item.tipoCalcada()}"></td>
            <td th:text="${item.altitude()}"></td>
            <!-- Trecho sem leitura: lâmina e status vêm null -->
            <td th:text="${item.ultimaLamina() != null} ? ${item.ultimaLamina()} : '—'"></td>
            <td>
                <span th:if="${item.ultimoStatus() == null}" class="badge text-bg-secondary">Sem leitura</span>
                <span th:if="${item.ultimoStatus() == 'NORMAL'}" class="badge text-bg-success">NORMAL</span>
                <span th:if="${item.ultimoStatus() == 'ATENCAO'}" class="badge text-bg-warning">ATENCAO</span>
                <span th:if="${item.ultimoStatus() == 'ALERTA'}" class="badge text-bg-danger">ALERTA</span>
            </td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-outline-secondary" th:href="@{/bairros}">← Voltar para bairros</a>
</main>
</body>
</html>
