<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leitura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🌧️ Cidade em Dia de Chuva</a>
        <div>
            <a class="btn btn-sm btn-outline-light" th:href="@{/bairros}">Bairros</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/trechos}">Trechos</a>
            <a class="btn btn-sm btn-light" th:href="@{/leituras}">Leituras</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 560px">
    <h1 class="h3 mb-3" th:text="${leitura.id() == null} ? 'Nova leitura' : 'Editar leitura'">Leitura</h1>

    <div class="alert alert-danger" th:if="${erro != null}" th:text="${erro}"></div>

    <form class="card card-body shadow-sm" th:action="@{/leituras/salvar}" th:object="${leitura}" method="post">

        <input type="hidden" id="id" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" for="trechoId">Trecho</label>
            <select id="trechoId" class="form-select" th:field="*{trechoId}"
                    th:classappend="${#fields.hasErrors('trechoId')} ? 'is-invalid'">
                <option value="">Selecione...</option>
                <option th:each="t : ${trechos}" th:value="${t.id()}"
                        th:text="|${t.logradouro()} (${t.nomeBairro()})|"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('trechoId')}" th:errors="*{trechoId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="dataHora">Data e hora</label>
            <input type="datetime-local" id="dataHora" class="form-control" th:field="*{dataHora}"
                   th:classappend="${#fields.hasErrors('dataHora')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="laminaCm">Lâmina (cm)</label>
            <input type="number" id="laminaCm" class="form-control" th:field="*{laminaCm}"
                   th:classappend="${#fields.hasErrors('laminaCm')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('laminaCm')}" th:errors="*{laminaCm}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a class="btn btn-outline-secondary" th:href="@{/leituras}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
