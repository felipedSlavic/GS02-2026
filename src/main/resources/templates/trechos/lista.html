<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trechos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🌧️ Cidade em Dia de Chuva</a>
        <div>
            <a class="btn btn-sm btn-outline-light" th:href="@{/bairros}">Bairros</a>
            <a class="btn btn-sm btn-light" th:href="@{/trechos}">Trechos</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/leituras}">Leituras</a>
        </div>
    </div>
</nav>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Trechos</h1>
        <a class="btn btn-success" th:href="@{/trechos/novo}">+ Novo trecho</a>
    </div>

    <div class="alert alert-danger" th:if="${erro != null}" th:text="${erro}"></div>

    <div class="alert alert-secondary" th:if="${#lists.isEmpty(trechos)}">Nenhum trecho cadastrado.</div>

    <table class="table table-striped table-hover bg-white shadow-sm" th:unless="${#lists.isEmpty(trechos)}">
        <thead class="table-primary">
        <tr>
            <th>Logradouro</th>
            <th>Bairro</th>
            <th>Tipo de calçada</th>
            <th>Altitude (m)</th>
            <th class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${trechos}">
            <td th:text="${t.logradouro()}"></td>
            <td th:text="${t.nomeBairro()}"></td>
            <td th:text="${t.tipoCalcada()}"></td>
            <td th:text="${t.altitude()}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/trechos/{id}/editar(id=${t.id()})}">Editar</a>
                <form class="d-inline" method="post"
                      th:action="@{/trechos/{id}/excluir(id=${t.id()})}"
                      onsubmit="return confirm('Excluir este trecho e todas as suas leituras?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
