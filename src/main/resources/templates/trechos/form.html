<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trecho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🌧️ Cidade em Dia de Chuva</a>
        <div>
            <a class="btn btn-sm btn-outline-light" th:href="@{/bairros}">Bairros</a>
            <a class="btn btn-sm btn-light" th:href="@{/trechos}">Trechos</a>
            <a class="btn btn-sm btn-outline-light" th:href="@{/leituras}">Leituras</a>
        </div>
    </div>
</nav>

<main class="container" style="max-width: 560px">
    <h1 class="h3 mb-3" th:text="${trecho.id() == null} ? 'Novo trecho' : 'Editar trecho'">Trecho</h1>

    <div class="alert alert-danger" th:if="${erro != null}" th:text="${erro}"></div>

    <form class="card card-body shadow-sm" th:action="@{/trechos/salvar}" th:object="${trecho}" method="post">

        <input type="hidden" id="id" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label" for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" class="form-control" th:field="*{logradouro}" maxlength="120"
                   th:classappend="${#fields.hasErrors('logradouro')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="bairroId">Bairro</label>
            <select id="bairroId" class="form-select" th:field="*{bairroId}"
                    th:classappend="${#fields.hasErrors('bairroId')} ? 'is-invalid'">
                <option value="">Selecione...</option>
                <option th:each="b : ${bairros}" th:value="${b.id()}" th:text="${b.nome()}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('bairroId')}" th:errors="*{bairroId}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="tipoCalcada">Tipo de calçada</label>
            <select id="tipoCalcada" class="form-select" th:field="*{tipoCalcada}"
                    th:classappend="${#fields.hasErrors('tipoCalcada')} ? 'is-invalid'">
                <option value="">Selecione...</option>
                <option th:each="tc : ${tiposCalcada}" th:value="${tc}" th:text="${tc}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('tipoCalcada')}" th:errors="*{tipoCalcada}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="altitude">Altitude (m)</label>
            <input type="number" id="altitude" class="form-control" th:field="*{altitude}"
                   th:classappend="${#fields.hasErrors('altitude')} ? 'is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('altitude')}" th:errors="*{altitude}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a class="btn btn-outline-secondary" th:href="@{/trechos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
